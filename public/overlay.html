<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>MMOBot Overlay</title>
  <script type="importmap">{ "imports": { "three": "/vendor/three/three.module.min.js", "three/addons/": "/vendor/three-addons/" } }</script>
  <link rel="icon" href="data:," />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@600;800&display=swap" rel="stylesheet" />
  <style>
    /* OBS Browser Source (e.g. 400×600), transparent background. Kept calm on purpose so it doesn't
       distract viewers: one event at a time at the bottom that slowly fades in, stays, and fades out.
       More events wait in a queue. Everything else (boss HP, goals...) lives on the website.
       URL options (build them on the admin page):
         ?events=big      only level-ups, rare finds, subs, raids... (default)   ?events=all  every action
         &seconds=6       how long each event stays      &max=1       how many can be on screen at once
         &quiet=1         don't show the "connected" message when the overlay loads
         &raid=1          show the raid / world boss bar
         &scenes=3d       the player's 3D character doing the action (default; needs WebGL, so turn on
                          "Use hardware acceleration" in OBS settings, else the flat scenes show)
         &scenes=2d       the older flat animated scenes      &scenes=0    plain text only
         &stats=1         show the rotating "this stream" panel (top XP, last rare find, raid MVP)
         &goal=1          show the channel goal bar      &project=1   show the community project bar
         &boost=1         show the channel boost banner
       Redemption effects (fireworks, spotlight...) play on the separate full-screen overlay: /fx.html */
    html, body { margin: 0; background: transparent; overflow: hidden; }
    body { font-family: Inter, system-ui, sans-serif; height: 100vh; display: flex; flex-direction: column; justify-content: flex-end; padding: 12px; box-sizing: border-box; gap: 8px; }
    .ev {
      display: flex; align-items: center; gap: 10px; padding: 8px 14px; border-radius: 12px;
      background: rgba(11, 14, 17, 0.45); color: #e8edf2; font-weight: 600; font-size: 16px;
      border-left: 3px solid rgba(83, 252, 24, 0.7); text-shadow: 0 1px 3px rgba(0, 0, 0, 0.8);
      opacity: 0; transition: opacity var(--fade, 1.2s) ease-in-out;
    }
    .ev.on { opacity: 1; }
    .ev .ic { font-size: 20px; }
    .ev b { color: #53fc18; }
    .ev small { color: #aab4c0; font-weight: 600; margin-left: 4px; }
    .ev.levelup, .ev.charlevel, .ev.follow, .ev.sub, .ev.gift { border-left-color: rgba(255, 201, 64, 0.8); }
    .ev.levelup b, .ev.charlevel b, .ev.follow b, .ev.sub b, .ev.gift b { color: #ffc940; }
    .ev.rare, .ev.redeem, .ev.fund { border-left-color: rgba(192, 132, 252, 0.8); }
    .ev.rare b, .ev.redeem b, .ev.fund b { color: #c084fc; }
    .ev.upgrade { border-left-color: rgba(56, 189, 248, 0.8); }
    .ev.upgrade b { color: #38bdf8; }
    .ev.raid, .ev.duel, .ev.event { border-left-color: rgba(255, 92, 122, 0.8); }
    .ev.raid b, .ev.duel b { color: #ff5c7a; }
    .ev.status { border-left-color: rgba(139, 152, 168, 0.8); font-size: 14px; }
    .ev.status.bad { border-left-color: rgba(255, 92, 122, 0.8); }
    /* Boss bar (and the optional panels), pinned to the top and updated in place. */
    #top { position: fixed; top: 12px; left: 12px; right: 12px; display: flex; flex-direction: column; gap: 8px; }
    .panel { padding: 8px 12px; border-radius: 12px; background: rgba(11, 14, 17, 0.45); color: #e8edf2; font-weight: 800; text-shadow: 0 1px 3px rgba(0, 0, 0, 0.8); animation: fade 1.2s ease-in-out; }
    .panel .name { display: flex; justify-content: space-between; gap: 8px; font-size: 14px; }
    .panel .name small { color: #aab4c0; font-weight: 600; white-space: nowrap; }
    .bar { height: 8px; margin-top: 6px; border-radius: 99px; background: rgba(28, 35, 44, 0.7); overflow: hidden; }
    .bar span { display: block; height: 100%; background: #f87171; transition: width 1s ease-out; }
    .boss { border-left: 3px solid rgba(255, 92, 122, 0.8); }
    .boss.world { border-left-color: rgba(164, 92, 255, 0.8); }
    .boss.world .bar span { background: #a78bfa; }
    .panel .sub { margin-top: 4px; font-size: 12px; font-weight: 600; color: #aab4c0; }
    .goal { border-left: 3px solid rgba(255, 201, 64, 0.8); }
    .goal .bar span { background: #fde047; }
    .project { border-left: 3px solid rgba(192, 132, 252, 0.8); }
    .project .bar span { background: #f0abfc; }
    .boost { border-left: 3px solid rgba(83, 252, 24, 0.8); color: #53fc18; font-size: 14px; }
    .stats { font-size: 13px; font-weight: 700; display: flex; align-items: center; flex-wrap: wrap; gap: 4px; }
    .stats .lbl { color: #aab4c0; font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; margin-right: 4px; }
    .stats .who { display: inline-flex; align-items: center; gap: 4px; margin-right: 8px; }
    .stats .who b { color: #53fc18; }
    /* 3D scene (default): the player's 3D character doing the action, on a see-through stage. */
    .ev.scene3d { padding: 2px 14px 2px 2px; gap: 4px; }
    .ev .stage3d { position: relative; flex: none; width: 190px; height: 128px; }
    .ev .stage3d canvas { position: absolute; inset: 0; width: 100% !important; height: 100% !important; }
    /* Animated scene (&scenes=2d): the player's character doing the action. */
    .ev.scene { padding: 4px 14px 4px 4px; gap: 6px; }
    .ev.scene svg.stage { flex: none; width: 160px; height: 88px; overflow: visible; }
    .ev .txt { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
    .ev .who { color: #53fc18; font-weight: 800; }
    .ev .what { color: #e8edf2; }
    .ev .xp { color: #aab4c0; font-size: 13px; }
    .ev.rare .who, .ev.rare .rare-tag { color: #c084fc; }
    .rare-tag { font-size: 12px; font-weight: 800; letter-spacing: 0.08em; }
    .face { width: 26px; height: 26px; border-radius: 50%; overflow: hidden; background: rgba(28, 35, 44, 0.7); flex: none; }
    .face svg { display: block; }
    .stage .arm { transform-box: view-box; transform-origin: 82px 99px; animation: swing 1.2s ease-in-out infinite; }
    .stage.m-stir .arm { animation: stir 1.6s ease-in-out infinite; }
    .stage.m-cast .arm { animation: cast 2s ease-in-out infinite; }
    .stage.m-stab .arm { animation: stab 1.2s ease-in-out infinite; }
    .stage.m-plant .arm { animation: plant 1.6s ease-in-out infinite; }
    .stage.m-shoot .arm { animation: recoil 1.6s ease-out infinite; }
    .stage .shot { animation: fly 1.6s ease-in infinite; }
    @keyframes swing { 0%, 100% { transform: rotate(-30deg); } 55% { transform: rotate(20deg); } }
    @keyframes stir { 0%, 100% { transform: rotate(-10deg); } 50% { transform: rotate(8deg); } }
    @keyframes cast { 0%, 100% { transform: rotate(-30deg); } 40% { transform: rotate(10deg); } }
    @keyframes stab { 0%, 100% { transform: translate(-4px, 0); } 55% { transform: translate(10px, -2px); } }
    @keyframes plant { 0%, 100% { transform: translate(0, -4px); } 55% { transform: translate(6px, 4px); } }
    @keyframes recoil { 0%, 30%, 100% { transform: none; } 38% { transform: translate(-4px, 0); } }
    @keyframes fly { 0%, 30% { opacity: 0; transform: none; } 35% { opacity: 1; } 60% { opacity: 1; transform: translateX(52px); } 61%, 100% { opacity: 0; transform: translateX(52px); } }
    @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
  </style>
</head>
<body>
  <div id="top"></div>
  <script src="/avatar.js"></script>
  <script>
    const params = new URLSearchParams(location.search);
    const on = (k) => ['1', 'true', 'on'].includes(params.get(k));
    const onlyBig = params.get('events') !== 'all';
    const seconds = Math.min(Math.max(Number(params.get('seconds')) || 6, 2), 120);
    const max = Math.min(Math.max(Number(params.get('max')) || 1, 1), 10);
    const quiet = params.has('quiet');
    // scenes: 3d (default; also the old "1") · 2d (flat animated scenes) · 0 (text only).
    const sceneMode = (params.get('scenes') || '3d').toLowerCase();
    const want3d = !['2d', '0', 'false', 'off', 'text'].includes(sceneMode);
    // 3D: loaded once, used for any event that comes with the player's character.
    const webgl = (() => {
      try {
        return !!document.createElement('canvas').getContext('webgl2');
      } catch {
        return false;
      }
    })();
    const three = want3d && webgl && window.MMOAvatar ? import('/avatar3d.js').catch(() => null) : null;
    // No WebGL (e.g. hardware acceleration off in OBS): the flat animated scenes instead.
    const scenes = !!window.MMOAvatar && (sceneMode === '2d' || (want3d && !three));
    const FADE = 1.2; // seconds to fade in and to fade out

    // What each skill looks like: the tool in the character's hand, what they work on, how the arm
    // moves, and the color of the bits that fly off.
    const SCENES = {
      fishing: { tool: '🎣', target: '🌊', move: 'cast', fx: '#5ab8f0' },
      mining: { tool: '⛏️', target: '🪨', move: 'swing', fx: '#a8a29e' },
      woodcutting: { tool: '🪓', target: '🌳', move: 'swing', fx: '#b07b4f' },
      digging: { tool: '🥄', target: '🟫', move: 'stab', fx: '#8d5a3b' },
      skinning: { tool: '🔪', target: '🦌', move: 'stab', fx: '#d0d0d0' },
      farming: { tool: '🌱', target: '🟫', move: 'plant', fx: '#6bc46b' },
      harvest: { tool: '🧺', target: '🌾', move: 'plant', fx: '#e3c16f' },
      firemaking: { tool: '🪨', target: '🪵', move: 'swing', fx: '#ffb03a' },
      agility: { tool: '👟', target: '🏁', move: 'swing', fx: '#22d3ee' },
      cooking: { tool: '🍳', target: '🔥', move: 'stir', fx: '#dddddd' },
      smelting: { tool: '🪨', target: '🧱', move: 'stab', fx: '#ff8a3a' },
      smithing: { tool: '🔨', target: '🧱', move: 'swing', fx: '#ffcf4a' },
      fletching: { tool: '🔪', target: '🪵', move: 'stab', fx: '#c9a06a' },
      carpentry: { tool: '🪚', target: '🪵', move: 'stab', fx: '#e0b878' },
      construction: { tool: '🔨', target: '🏗️', move: 'swing', fx: '#c9a06a' },
      crafting: { tool: '🧵', target: '🟤', move: 'stab', fx: '#c9a06a' },
      alchemy: { tool: '🥄', target: '⚗️', move: 'stir', fx: '#b58cf0' },
      swords: { tool: '🗡️', target: '👹', move: 'swing', fx: '#ff5c7a' },
      archery: { tool: '🏹', target: '👹', move: 'shoot', fx: '#ff5c7a', shot: '➳' },
      magic: { tool: '🪄', target: '👹', move: 'shoot', fx: '#b58cf0', shot: '✦' },
    };

    // Emoji tools are drawn pointing different ways. Mirror the ones that point left, then place the
    // emoji so its handle sits in the character's hand.
    const FLIP = ['🎣', '⛏️', '🪓', '🥄', '🔨', '🍳'];
    const HELD = ['🏹', '🌱', '🧺', '🪨', '🧵'];
    function toolIn(tool, hx, hy) {
      const [dx, dy] = HELD.includes(tool) ? [5, -9] : tool === '🔪' ? [11, 11] : [12, -12];
      return `<g transform="translate(${hx + dx} ${hy + dy})${FLIP.includes(tool) ? ' scale(-1 1)' : ''}"><text font-size="30" text-anchor="middle" dominant-baseline="central">${tool}</text></g>`;
    }

    function stage(a) {
      const sc = SCENES[a.skill === 'farming' && /^harvested/.test(a.text) ? 'harvest' : a.skill];
      if (!sc || !a.appearance) return '';
      const { skin, outfit } = MMOAvatar.colorsOf(a.appearance);
      const target = a.target || sc.target;
      const shot = sc.shot ? `<text class="shot" x="108" y="80" font-size="18" fill="${sc.fx}" text-anchor="middle" dominant-baseline="central">${sc.shot}</text>` : '';
      return `<svg class="stage m-${sc.move}" viewBox="0 0 220 120">
        <ellipse cx="54" cy="116" rx="44" ry="5" fill="#000" opacity=".35"/>
        <ellipse cx="172" cy="114" rx="30" ry="5" fill="#000" opacity=".35"/>
        <g transform="translate(6,6) scale(.8)">${MMOAvatar.parts(a.appearance)}</g>
        <g class="arm">
          <path d="M80,100 L102,86" stroke="${outfit}" stroke-width="11" stroke-linecap="round"/>
          ${toolIn(sc.tool, 105, 85)}
          <circle cx="105" cy="85" r="5.5" fill="${skin}"/>
        </g>
        ${shot}
        <text class="target" x="172" y="86" font-size="50" text-anchor="middle" dominant-baseline="central">${esc(target)}</text>
        ${a.icon ? `<text x="172" y="30" font-size="26" text-anchor="middle" dominant-baseline="central">${esc(a.icon)}</text>` : ''}
      </svg>`;
    }
    const face = (a) => (scenes && a.appearance ? `<span class="face">${MMOAvatar.svg(a.appearance, { size: 26, head: true })}</span>` : '');

    const BIG = ['levelup', 'charlevel', 'rare', 'upgrade', 'jackpot', 'follow', 'sub', 'gift', 'raid', 'duel', 'event', 'redeem', 'fund'];
    const icons = { levelup: '🎉', charlevel: '⭐', rare: '💎', sell: '💰', upgrade: '🔧', buy: '🛒', action: '✨', test: '🧪', jackpot: '🎰', death: '💀', achievement: '🏆', task: '📋', trade: '🤝', follow: '💚', sub: '⭐', gift: '🎁', kicks: '💎', raid: '⚔️', duel: '⚔️', event: '📣', pull: '🃏', unbox: '🧰', redeem: '📣', fund: '🏛️' };
    const skillIcons = { fishing: '🎣', mining: '⛏️', woodcutting: '🪓', digging: '🏺', smelting: '🔥', smithing: '⚒️', swords: '🗡️', skinning: '🔪', farming: '🌱' };
    const esc = (v) => String(v ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);

    // One event at a time (or `max`): each fades in, stays, fades out, then the next one in the queue
    // shows. A long queue shortens the stay, and the oldest waiting events are dropped past 15.
    const queue = [];
    let showing = 0;
    function show(html, cls, stay = seconds, action = null) {
      const item = { html, cls, stay, action };
      queue.push(item);
      while (queue.length > 15) queue.shift();
      next();
      return item;
    }
    function next() {
      if (showing >= max || !queue.length) return;
      const item = queue.shift();
      showing++;
      const el = document.createElement('div');
      el.className = `ev ${item.cls}`;
      el.style.setProperty('--fade', `${FADE}s`);
      el.innerHTML = item.html;
      document.body.appendChild(el);
      item.el = el;
      if (item.action && three) {
        three.then((mod) => {
          const stage = el.querySelector('.stage3d');
          if (!mod || !stage || item.gone) return;
          try {
            item.view = mod.mount(stage, item.action.appearance, { action: item.action, zoom: 0.8 });
          } catch (err) {
            console.error(err);
          }
        });
      }
      requestAnimationFrame(() => requestAnimationFrame(() => el.classList.add('on')));
      const stay = queue.length > 3 ? Math.min(item.stay, Math.max(3, seconds / 2)) : item.stay;
      item.timer = setTimeout(() => hide(item), (FADE + stay) * 1000);
    }
    function hide(item) {
      if (item.gone) return;
      item.gone = true;
      clearTimeout(item.timer);
      const i = queue.indexOf(item);
      if (i >= 0) return void queue.splice(i, 1);
      if (!item.el) return;
      item.el.classList.remove('on');
      setTimeout(() => {
        item.view?.dispose();
        item.el.remove();
        showing--;
        next();
      }, FADE * 1000);
    }

    let connected = false;
    let lostTimer = null;
    let lostNotice = null;
    const es = new EventSource('/api/events');
    es.addEventListener('open', () => {
      clearTimeout(lostTimer);
      if (lostNotice) hide(lostNotice);
      lostNotice = null;
      if (!connected && !quiet) show('<span class="ic">✅</span><span>MMOBot overlay connected</span>', 'status', 5);
      connected = true;
    });
    es.addEventListener('error', () => {
      // EventSource reconnects by itself; only say something if it stays down.
      clearTimeout(lostTimer);
      lostTimer = setTimeout(() => {
        if (es.readyState !== EventSource.OPEN && !lostNotice) {
          lostNotice = show('<span class="ic">⚠️</span><span>Overlay reconnecting…</span>', 'status bad', 3600);
        }
      }, 10000);
    });
    // Optional panels at the top (boss bar, goal, project, boost, stats), all off by default. Panels are updated in
    // place, so a new number doesn't redraw or re-animate anything; only a panel that appears fades in.
    const showTop = on('raid');
    const showGoal = on('goal');
    const showProject = on('project');
    const showBoost = on('boost');
    const showStats = on('stats');
    const topEl = document.getElementById('top');
    let raid = null;
    let world = null;
    let boost = null;
    let goal = null;
    let project = null;
    let projectDone = null;
    let stats = null;
    let slide = 0;
    const fmtN = (n) => Number(n).toLocaleString();
    const panels = new Map();
    // p: { key, cls, name, right, pct, sub, html }
    function renderPanel(p) {
      let el = panels.get(p.key);
      if (!el) {
        el = document.createElement('div');
        el.innerHTML = '<div class="name"><span></span><small></small></div><div class="bar"><span></span></div><div class="sub"></div><div class="html"></div>';
        panels.set(p.key, el);
      }
      el.className = `panel ${p.cls}`;
      const set = (sel, v, prop = 'textContent') => {
        const n = el.querySelector(sel);
        if (n[prop] !== v) n[prop] = v;
      };
      el.querySelector('.name').style.display = p.name ? '' : 'none';
      set('.name span', p.name || '');
      set('.name small', p.right || '');
      el.querySelector('.bar').style.display = p.pct == null ? 'none' : '';
      if (p.pct != null) el.querySelector('.bar span').style.width = `${p.pct}%`;
      el.querySelector('.sub').style.display = p.sub ? '' : 'none';
      set('.sub', p.sub || '');
      el.querySelector('.html').style.display = p.html ? '' : 'none';
      set('.html', p.html || '', 'innerHTML');
      return el;
    }
    function drawTop() {
      const list = [];
      if (showBoost && boost && boost.until > Date.now()) {
        const m = Math.max(1, Math.ceil((boost.until - Date.now()) / 60000));
        list.push({ key: 'boost', cls: 'boost', name: `⚡ ${boost.multiplier}x ${boost.kind === 'xp' ? 'XP' : 'chat points'} for everyone`, right: `${m}m left` });
      }
      if (showTop) {
        for (const r of [raid, world]) {
          if (!r || !r.active) continue;
          const ms = Math.max(0, r.endsAt - Date.now());
          const left = r.world ? `${Math.ceil(ms / 86_400_000)}d` : `${Math.ceil(ms / 60000)}m`;
          list.push({
            key: r.world ? 'world' : 'raid',
            cls: `boss${r.world ? ' world' : ''}`,
            name: `${r.icon} ${r.name}`,
            right: `${fmtN(r.hp)} HP · ${left}`,
            pct: Math.max(0, Math.min(100, (r.hp / r.maxHp) * 100)),
            sub: `!attack · ${r.fighters || 0} fighting`,
          });
        }
      }
      if (showGoal && goal) {
        list.push(goal.done
          ? { key: 'goal', cls: 'goal', name: `🎉 Goal reached! ${goal.multiplier}x XP for everyone` }
          : { key: 'goal', cls: 'goal', name: `🎯 ${goal.label}`, right: `${fmtN(goal.progress)} / ${fmtN(goal.target)}`, pct: Math.min(100, (goal.progress / goal.target) * 100) });
      }
      if (showProject && projectDone && projectDone.until > Date.now()) {
        list.push({ key: 'project', cls: 'project', name: `${projectDone.icon} ${projectDone.name} complete!` });
      } else if (showProject && project) {
        list.push({ key: 'project', cls: 'project', name: `${project.icon} ${project.name}`, right: `${fmtN(project.progress)} / ${fmtN(project.goal)}`, pct: Math.min(100, (project.progress / project.goal) * 100), sub: '!fund 500 to chip in' });
      }
      if (showStats && stats) {
        const slides = [];
        if (stats.top && stats.top.length) {
          slides.push(`<span class="lbl">Top XP this stream</span>${stats.top
            .map((t, i) => `<span class="who">${['🥇', '🥈', '🥉'][i]}<b>${esc(t.username)}</b> ${fmtN(t.xp)}</span>`)
            .join('')}`);
        }
        if (stats.lastRare) slides.push(`<span class="lbl">Last rare find</span>💎 <b style="color:#c084fc">${esc(stats.lastRare.username)}</b> ${esc(stats.lastRare.text)}`);
        if (stats.mvp) slides.push(`<span class="lbl">Raid MVP</span>👑 <b style="color:#ff5c7a">${esc(stats.mvp.username)}</b>`);
        if (slides.length) list.push({ key: 'stats', cls: 'stats', html: slides[slide % slides.length] });
      }
      const keep = new Set(list.map((p) => p.key));
      for (const [k, el] of panels) {
        if (!keep.has(k)) {
          el.remove();
          panels.delete(k);
        }
      }
      list.forEach((p, i) => {
        const el = renderPanel(p);
        if (topEl.children[i] !== el) topEl.insertBefore(el, topEl.children[i] || null);
      });
    }
    es.addEventListener('raid', (e) => {
      const r = JSON.parse(e.data);
      if (r.world) world = r;
      else raid = r;
      drawTop();
    });
    es.addEventListener('goal', (e) => {
      goal = JSON.parse(e.data);
      drawTop();
    });
    es.addEventListener('project', (e) => {
      project = JSON.parse(e.data);
      if (project?.completed) projectDone = { ...project.completed, until: Date.now() + 20_000 };
      drawTop();
    });
    es.addEventListener('streamstats', (e) => {
      stats = JSON.parse(e.data);
      drawTop();
    });
    // Rotate the "this stream" panel (slowly).
    setInterval(() => {
      slide++;
      if (showStats && stats) drawTop();
    }, 20000);
    es.addEventListener('boost', (e) => {
      boost = JSON.parse(e.data);
      drawTop();
    });
    setInterval(drawTop, 15000);

    es.addEventListener('activity', (e) => {
      const a = JSON.parse(e.data);
      const big = BIG.includes(a.kind) || a.kind === 'test';
      if (onlyBig && !big) return;
      if (three && a.appearance) {
        const icon = a.kind === 'action' || a.kind === 'rare' ? a.icon : icons[a.kind] || a.icon;
        const tag = a.kind === 'rare' ? '<span class="rare-tag">✨ RARE FIND</span>' : a.kind === 'levelup' || a.kind === 'charlevel' ? '<span class="rare-tag" style="color:#ffc940">LEVEL UP</span>' : '';
        const xpLine = a.xp ? `<span class="xp">+${Number(a.xp).toLocaleString()} xp</span>` : '';
        show(
          `<div class="stage3d"></div><span class="txt">${tag}<span class="who">${esc(a.username)}</span><span class="what">${esc(a.text)}</span>${xpLine}</span>`,
          `scene3d ${esc(a.kind)}`,
          seconds,
          { appearance: a.appearance, skill: a.skill, kind: a.kind, target: a.target, loot: icon, harvest: /^harvested/.test(a.text || '') }
        );
        return;
      }
      const scene = scenes && ['action', 'rare', 'test'].includes(a.kind) ? stage(a) : '';
      if (scene) {
        const xpLine = a.xp ? `<span class="xp">+${Number(a.xp).toLocaleString()} xp</span>` : '';
        show(
          `${scene}<span class="txt">${a.kind === 'rare' ? '<span class="rare-tag">✨ RARE FIND</span>' : ''}<span class="who">${esc(a.username)}</span><span class="what">${esc(a.text)}</span>${xpLine}</span>`,
          `scene ${esc(a.kind)}${a.kind === 'rare' ? ' big' : ''}`,
          seconds
        );
        return;
      }
      const icon = a.kind === 'action' ? skillIcons[a.skill] || icons.action : icons[a.kind] || '✨';
      const xp = a.xp && !big ? `<small>+${Number(a.xp).toLocaleString()} xp</small>` : '';
      show(`${face(a)}<span class="ic">${icon}</span><span>${a.username ? `<b>${esc(a.username)}</b> ` : ''}${esc(a.text)}${xp}</span>`, `${esc(a.kind)}${big ? ' big' : ''}`);
    });
  </script>
</body>
</html>
