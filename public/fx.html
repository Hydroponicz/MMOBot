<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>MMOBot Effects</title>
  <link rel="icon" href="data:," />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@600;800;900&display=swap" rel="stylesheet" />
  <style>
    /* OBS Browser Source, full screen (1920×1080), transparent. Plays stream redemptions (fireworks,
       fanfare, spotlight, double XP, raid...) and community project celebrations, one at a time.
       URL options:  ?sound=0  no sounds   &volume=0.5  sound volume (0-1)
       In OBS tick "Control audio via OBS" on the source to hear (and mix) the fanfare. */
    html, body { margin: 0; width: 100%; height: 100%; background: transparent; overflow: hidden; font-family: Inter, system-ui, sans-serif; }
    canvas { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; }
    #fx { position: fixed; inset: 0; pointer-events: none; }
    .banner {
      position: absolute; left: 50%; bottom: 12%; transform: translateX(-50%); padding: 22px 44px; border-radius: 22px; text-align: center; white-space: nowrap;
      background: rgba(11, 14, 17, 0.9); color: #fff; box-shadow: 0 18px 60px rgba(0, 0, 0, 0.6); border: 3px solid var(--c, #53fc18);
      animation: bannerIn 0.6s cubic-bezier(0.2, 1.4, 0.4, 1), fadeOut 0.6s ease-in var(--out, 6s) forwards;
    }
    .banner .big { font-size: 64px; font-weight: 900; letter-spacing: -0.02em; line-height: 1.05; }
    .banner .big b { color: var(--c, #53fc18); }
    .banner .small { font-size: 28px; font-weight: 700; color: #cfd6de; margin-top: 6px; }
    .banner .tag { display: inline-block; font-size: 22px; font-weight: 900; letter-spacing: 0.12em; color: var(--c, #53fc18); margin-bottom: 6px; }
    .dim { position: absolute; inset: 0; background: radial-gradient(circle at 50% 46%, transparent 0 17%, rgba(0, 0, 0, 0.78) 31%); animation: fadeIn 0.6s, fadeOut 0.6s ease-in var(--out, 7s) forwards; }
    .beam { position: absolute; left: 50%; top: -10%; width: 38%; height: 100%; transform: translateX(-50%); background: linear-gradient(180deg, rgba(255, 244, 200, 0.35), rgba(255, 244, 200, 0) 80%); clip-path: polygon(42% 0, 58% 0, 100% 100%, 0 100%); animation: fadeIn 0.8s, fadeOut 0.6s ease-in var(--out, 7s) forwards; }
    .hero { position: absolute; left: 50%; top: 46%; transform: translate(-50%, -50%); animation: heroIn 0.9s cubic-bezier(0.2, 1.3, 0.4, 1), fadeOut 0.6s ease-in var(--out, 7s) forwards; filter: drop-shadow(0 20px 40px rgba(0, 0, 0, 0.6)); }
    .hero svg { display: block; }
    .monument { filter: grayscale(1) sepia(0.35) brightness(1.1) drop-shadow(0 20px 40px rgba(0, 0, 0, 0.6)); }
    .plinth { width: 340px; height: 46px; margin: -6px auto 0; border-radius: 6px; background: linear-gradient(180deg, #d8d2c4, #9c9484); color: #3a352c; font-weight: 900; font-size: 20px; display: grid; place-items: center; }
    @keyframes bannerIn { from { transform: translate(-50%, 60px) scale(0.6); opacity: 0; } }
    @keyframes heroIn { from { transform: translate(-50%, 30%) scale(0.5); opacity: 0; } }
    @keyframes fadeIn { from { opacity: 0; } }
    @keyframes fadeOut { to { opacity: 0; } }
    @keyframes shake { 10%, 90% { transform: translateX(-50%) rotate(-1deg); } 30%, 70% { transform: translateX(-50%) rotate(1.5deg); } 50% { transform: translateX(-50%) rotate(-1.5deg); } }
    .banner.shake { animation: bannerIn 0.6s cubic-bezier(0.2, 1.4, 0.4, 1), shake 0.5s 0.6s 3, fadeOut 0.6s ease-in var(--out, 6s) forwards; }
  </style>
</head>
<body>
  <canvas id="cv"></canvas>
  <div id="fx"></div>
  <script src="/avatar.js"></script>
  <script>
    const params = new URLSearchParams(location.search);
    const soundOn = params.get('sound') !== '0';
    const volume = Math.min(1, Math.max(0, Number(params.get('volume') ?? 0.5)));
    const $fx = document.getElementById('fx');
    const cv = document.getElementById('cv');
    const ctx = cv.getContext('2d');
    const esc = (v) => String(v ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
    const resize = () => {
      cv.width = innerWidth * devicePixelRatio;
      cv.height = innerHeight * devicePixelRatio;
    };
    addEventListener('resize', resize);
    resize();

    // ---- Particles (fireworks and confetti) --------------------------------------------------
    let parts = [];
    let running = false;
    function loop() {
      ctx.clearRect(0, 0, cv.width, cv.height);
      const g = 0.06 * devicePixelRatio;
      parts = parts.filter((p) => p.life > 0);
      for (const p of parts) {
        p.life--;
        if (p.rocket) {
          p.y += p.vy;
          p.vy *= 0.985;
          ctx.fillStyle = '#fff6c0';
          ctx.fillRect(p.x, p.y, 3 * devicePixelRatio, 10 * devicePixelRatio);
          if (p.life <= 0 || p.vy > -2) {
            p.life = 0;
            burst(p.x, p.y, p.color);
          }
          continue;
        }
        p.vy += p.confetti ? g * 0.4 : g;
        p.vx *= p.confetti ? 0.99 : 0.975;
        p.x += p.vx;
        p.y += p.vy;
        p.rot += p.spin || 0;
        ctx.globalAlpha = Math.min(1, p.life / 40);
        ctx.fillStyle = p.color;
        if (p.confetti) {
          ctx.save();
          ctx.translate(p.x, p.y);
          ctx.rotate(p.rot);
          ctx.fillRect(-5 * devicePixelRatio, -3 * devicePixelRatio, 10 * devicePixelRatio, 6 * devicePixelRatio);
          ctx.restore();
        } else {
          ctx.beginPath();
          ctx.arc(p.x, p.y, 2.6 * devicePixelRatio, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.globalAlpha = 1;
      }
      if (parts.length) requestAnimationFrame(loop);
      else {
        running = false;
        ctx.clearRect(0, 0, cv.width, cv.height);
      }
    }
    const start = () => {
      if (!running) {
        running = true;
        requestAnimationFrame(loop);
      }
    };
    const COLORS = ['#ff5c7a', '#ffc940', '#53fc18', '#38bdf8', '#c084fc', '#ff8a3a', '#ffffff'];
    function burst(x, y, color) {
      const n = 90;
      for (let i = 0; i < n; i++) {
        const a = (i / n) * Math.PI * 2;
        const s = (2.5 + Math.random() * 4.5) * devicePixelRatio;
        parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 70 + Math.random() * 40, color: Math.random() < 0.8 ? color : '#fff' });
      }
      pop();
      start();
    }
    function fireworks(count = 9) {
      for (let i = 0; i < count; i++) {
        setTimeout(() => {
          parts.push({ rocket: true, x: cv.width * (0.15 + Math.random() * 0.7), y: cv.height, vy: -(13 + Math.random() * 5) * devicePixelRatio, life: 90, color: COLORS[Math.floor(Math.random() * COLORS.length)] });
          start();
        }, i * 520);
      }
    }
    function confetti(n = 260) {
      for (let i = 0; i < n; i++) {
        parts.push({ confetti: true, x: Math.random() * cv.width, y: -Math.random() * cv.height * 0.4, vx: (Math.random() - 0.5) * 3 * devicePixelRatio, vy: (1 + Math.random() * 3) * devicePixelRatio, rot: Math.random() * 6, spin: (Math.random() - 0.5) * 0.3, life: 360, color: COLORS[i % COLORS.length] });
      }
      start();
    }

    // ---- Sounds (made on the fly, no files) ---------------------------------------------------
    let audio = null;
    function tone(freq, at, dur, type = 'sawtooth', vol = 1) {
      if (!soundOn) return;
      try {
        audio ??= new (window.AudioContext || window.webkitAudioContext)();
        const t = audio.currentTime + at;
        const o = audio.createOscillator();
        const f = audio.createBiquadFilter();
        const g = audio.createGain();
        o.type = type;
        o.frequency.value = freq;
        f.type = 'lowpass';
        f.frequency.value = 2400;
        g.gain.setValueAtTime(0.0001, t);
        g.gain.exponentialRampToValueAtTime(0.18 * volume * vol, t + 0.03);
        g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
        o.connect(f).connect(g).connect(audio.destination);
        o.start(t);
        o.stop(t + dur + 0.05);
      } catch {
        /* no audio */
      }
    }
    const fanfare = () => [[392, 0, 0.18], [523, 0.2, 0.18], [659, 0.4, 0.18], [784, 0.6, 0.55], [659, 1.2, 0.18], [784, 1.4, 0.9]].forEach(([f, at, d]) => { tone(f, at, d); tone(f / 2, at, d, 'square', 0.5); });
    const pop = () => tone(180 + Math.random() * 120, 0, 0.25, 'triangle', 0.8);
    const chime = () => [[784, 0], [988, 0.12], [1175, 0.24], [1568, 0.36]].forEach(([f, at]) => tone(f, at, 0.5, 'triangle'));

    // ---- One effect at a time -----------------------------------------------------------------
    const queue = [];
    let busy = false;
    function enqueue(fn) {
      queue.push(fn);
      if (!busy) next();
    }
    function next() {
      const fn = queue.shift();
      if (!fn) return (busy = false);
      busy = true;
      const ms = fn();
      setTimeout(() => {
        $fx.innerHTML = '';
        next();
      }, ms);
    }
    const banner = (tag, big, small, color, stay, cls = '') =>
      `<div class="banner ${cls}" style="--c:${color};--out:${stay - 0.6}s">${tag ? `<div class="tag">${tag}</div>` : ''}<div class="big">${big}</div>${small ? `<div class="small">${small}</div>` : ''}</div>`;
    const hero = (appearance, size, stay, extra = '', cls = '') =>
      appearance && window.MMOAvatar ? `<div class="hero ${cls}" style="--out:${stay - 0.6}s">${MMOAvatar.svg(appearance, { size })}${extra}</div>` : '';

    function play(r) {
      const who = `<b>${esc(r.username)}</b>`;
      const title = r.title ? ` ${esc(r.title)}` : '';
      if (r.id === 'fireworks') {
        enqueue(() => {
          fireworks(10);
          $fx.innerHTML = banner('🎆 FIREWORKS', `${who}`, 'lit up the sky!', '#ffc940', 7);
          return 7200;
        });
      } else if (r.id === 'fanfare') {
        enqueue(() => {
          fanfare();
          $fx.innerHTML = banner('📯 FANFARE', `ALL HAIL ${who}`, title ? `${esc(r.username)}${title}` : '', '#ffc940', 6, 'shake');
          return 6200;
        });
      } else if (r.id === 'spotlight') {
        enqueue(() => {
          chime();
          $fx.innerHTML = `<div class="dim" style="--out:7.4s"></div><div class="beam" style="--out:7.4s"></div>${hero(r.appearance, 420, 8)}${banner('🔦 IN THE SPOTLIGHT', who, `${title ? `${esc(r.username)}${title}` : ''}${r.level ? `${title ? ' · ' : ''}Level ${r.level}` : ''}`, '#fff4c8', 8)}`;
          return 8200;
        });
      } else {
        const color = { xp: '#53fc18', raid: '#ff5c7a', goblin: '#ffc940' }[r.id] || '#53fc18';
        enqueue(() => {
          chime();
          $fx.innerHTML = banner(`${r.icon} ${esc(r.name).toUpperCase()}`, esc(r.text.replace(/^\S+\s/, '')), '', color, 6, r.id === 'raid' ? 'shake' : '');
          return 6200;
        });
      }
    }

    function celebrate(p) {
      const c = p.completed;
      enqueue(() => {
        confetti();
        fanfare();
        const statue = c.id === 'monument' ? hero(c.appearance, 340, 9, `<div class="plinth">${esc(c.top)}</div>`, 'monument') : '';
        $fx.innerHTML = `${statue}${banner(`${c.icon} COMMUNITY PROJECT COMPLETE`, esc(c.name), `${esc(c.effect)} · top donor <b style="color:#ffc940">${esc(c.top)}</b>`, '#ffc940', 9)}`;
        return 9200;
      });
    }

    const es = new EventSource('/api/events');
    es.addEventListener('redeem', (e) => play(JSON.parse(e.data)));
    es.addEventListener('project', (e) => {
      const p = JSON.parse(e.data);
      if (p && p.completed) celebrate(p);
    });
  </script>
</body>
</html>
